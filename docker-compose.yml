# Local MongoDB for development.
#   docker compose up -d
# Then set MONGO_URI=mongodb://localhost:27017/ironrank in backend/.env
services:
  mongo:
    image: mongo:7
    container_name: ironrank-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ironrank-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ironrank-mongo-data:
