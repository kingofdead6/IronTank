<!doctype html>
<!-- Served by static hosts (Netlify, GitHub Pages, Render, ...) for unknown URLs.
     Sends visitors to the app's own "Lost in orbit" page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost in orbit — IronRank</title>
    <meta http-equiv="refresh" content="0; url=/#/not-found" />
    <script>location.replace('/#/not-found');</script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0e; color: #fff; font-family: system-ui, sans-serif; }
      a { color: #ff2e88; }
    </style>
  </head>
  <body>
    <p>Page not found. <a href="/">Back to IronRank</a></p>
  </body>
</html>
